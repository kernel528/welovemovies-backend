kind: pipeline
type: docker
name: validation

trigger:
  event:
    - pull_request
  branch:
    - dev
    - main

volumes:
  - name: docker_sock
    host:
      path: /var/run/docker.sock

steps:
  - name: docker-test-build
    image: docker:27-cli
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker build --target test --tag welovemovies-backend:ci-${DRONE_COMMIT:0:8}-${DRONE_BUILD_NUMBER}-test .

  - name: docker-runtime-build
    image: docker:27-cli
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker build --target runtime --tag welovemovies-backend:ci-${DRONE_COMMIT:0:8}-${DRONE_BUILD_NUMBER} .

  - name: smoke-test
    image: docker:27-cli
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - docker run --detach --name welovemovies-backend-test-${DRONE_BUILD_NUMBER} --env NODE_ENV=test welovemovies-backend:ci-${DRONE_COMMIT:0:8}-${DRONE_BUILD_NUMBER}
      - |
        for _ in $(seq 1 15); do
          if docker run --rm --network container:welovemovies-backend-test-${DRONE_BUILD_NUMBER} curlimages/curl:8.7.1 --fail http://localhost:5001/; then
            exit 0
          fi
          sleep 1
        done
        exit 1

  - name: smoke-test-cleanup
    image: docker:27-cli
    volumes:
      - name: docker_sock
        path: /var/run/docker.sock
    when:
      status:
        - success
        - failure
    commands:
      - docker rm --force welovemovies-backend-test-${DRONE_BUILD_NUMBER} || true

  - name: slack-notification
    image: plugins/slack
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts
    when:
      status:
        - success
        - failure

